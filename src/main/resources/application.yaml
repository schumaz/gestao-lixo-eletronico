server:
  port: 8080

app:
  api:
    base-url: ${APP_API_BASE_URL:http://localhost:${server.port:8080}}

spring:
  application:
    name: lixo-eletronico
  profiles:
      active: local  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lixo_eletronico_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
